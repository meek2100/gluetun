name: Build Test Docker Image

# Allows you to run this workflow manually from the Actions tab
on: workflow_dispatch

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    # Set permissions for GITHUB_TOKEN to allow pushing to GHCR
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # Checks out your code so the action can access it

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3 # Sets up Docker build environment

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          # Use the GITHUB_ACTOR (your username) and GITHUB_TOKEN for authentication
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: . # Use the current directory as the build context
          push: true # Push the image to the registry
          # Tag the image. Adjust 'gluetun' if your repo name is different
          # Example tag: ghcr.io/meek2100/gluetun:test-latest
          tags: ghcr.io/${{ github.repository_owner }}/gluetun:test-latest
          # Optional: cache build layers to speed up subsequent builds
          cache-from: type=gha
          cache-to: type=gha,mode=max
